<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>House Line</title>
  <meta name="theme-color" content="#0F6B4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="House Line">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=17">
</head>
<body>
  <header class="top" id="top" hidden>
    <div class="top-row">
      <button class="group-btn" id="groupBtn" aria-label="Switch group">
        <span class="brand">House<span>Line</span></span>
        <span class="group-name" id="groupName"></span>
      </button>
      <div class="top-right">
        <div class="wallet" aria-label="Your token balance">
          <div class="token" aria-hidden="true"></div>
          <div><b class="num" id="bal">—</b> <small>tokens</small></div>
        </div>
        <button class="bell-btn" id="bellBtn" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="bell-count" id="bellCount" hidden></span></button>
        <button class="me-btn" id="meBtn" aria-label="Your profile"><span id="meAvatar"></span></button>
      </div>
    </div>
  </header>

  <main id="app"><div class="empty"><b>Loading…</b></div></main>

  <nav class="tabs" id="tabs" aria-label="Sections" hidden>
    <button data-tab="board"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>Board</button>
    <button data-tab="create"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>New bet</button>
    <button data-tab="props"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 13l2-2 2 2M18 11v8"/></svg>Props</button>
    <button data-tab="slip"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>My slip</button>
    <button data-tab="leaders"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Leaders</button>
  </nav>

  <div id="sheetHost"></div>
  <div id="toastHost"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=17"></script>
  <script src="app.js?v=17"></script>
</body>
</html>
